version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: certificados_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: certificados_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password_change_me
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d certificados_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
